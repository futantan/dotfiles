# Prefix keys
set -g prefix C-Space
set -g prefix2 C-b
bind C-Space send-prefix

# Config and help
# prefix + q reload config
bind q source-file ~/.tmux.conf \; display "Configuration reloaded"

# Vi mode for copy
# Use vi keys in copy mode; v starts selection, y copies and exits copy mode.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Pane Controls
# Alt-Enter / Alt-Shift-Enter: split panes vertically/horizontally in the current directory.
bind -n M-Enter split-window -v -c "#{pane_current_path}"
bind -n M-S-Enter split-window -h -c "#{pane_current_path}"
# Alt-Escape: close the current pane.
bind -n M-Escape kill-pane

# prefix + h / v / x: split or close panes.
bind h split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind x kill-pane

# Alt-h/j/k/l: move focus between panes with vim-style keys.
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Ctrl-Alt-Shift-arrow: resize panes by 5 cells.
bind -n C-M-S-Left resize-pane -L 5
bind -n C-M-S-Down resize-pane -D 5
bind -n C-M-S-Up resize-pane -U 5
bind -n C-M-S-Right resize-pane -R 5

# Window navigation
# prefix + r / c / k: rename, create, or close windows.
bind r command-prompt -I "#W" "rename-window -- '%%'"
bind c new-window -c "#{pane_current_path}"
bind k kill-window

# Alt-left/right: switch windows; Alt-Shift-left/right: move the current window.
bind -n M-Left select-window -t -1
bind -n M-Right select-window -t +1
bind -n M-S-Left swap-window -t -1 \; select-window -t -1
bind -n M-S-Right swap-window -t +1 \; select-window -t +1

# Session controls
# prefix + R / C / K: rename, create, or close sessions.
bind R command-prompt -I "#S" "rename-session -- '%%'"
bind C new-session -c "#{pane_current_path}"
bind K kill-session
# prefix + P / N: switch to the previous or next session.
bind P switch-client -p
bind N switch-client -n

# Alt-up/down: switch directly to the previous or next session.
bind -n M-Up switch-client -p
bind -n M-Down switch-client -n

# General
# Enable 256-color and RGB true color support.
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
# Enable mouse support, 1-based indexes, and automatic window renumbering.
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
# Keep a larger scrollback history and reduce key delay for faster Esc/combo handling.
set -g history-limit 50000
set -g escape-time 0
# Report focus changes to applications and integrate with the system clipboard.
set -g focus-events on
set -g set-clipboard on
# Allow terminal passthrough sequences and aggressively resize for the active client.
set -g allow-passthrough on
setw -g aggressive-resize on
# Keep the client attached when the last window is closed.
set -g detach-on-destroy off
# Enable extended key encoding for better complex key-combo recognition.
set -g extended-keys on
set -g extended-keys-format csi-u
# Server-level escape-time; this overrides the global value above, so the final value is 10ms.
set -sg escape-time 10

# Status bar
# # Put the status bar at the top and refresh it every 5 seconds.
set -g status-position top
set -g status-interval 5
# # Limit left/right status lengths to avoid crowding the window list.
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""

# # Automatically name windows from the current pane path.
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'

# Theme
# Use the terminal default background to keep the status bar lightweight.
set -g status-style "bg=default,fg=default"
# Show the session name on the left.
set -g status-left "#[fg=black,bg=blue,bold] #S #[bg=default] "
# Show copy mode, prefix, zoom status, and hostname on the right.
set -g status-right "#[fg=blue]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=brightblack]#h "
# Styles for normal and current windows.
set -g window-status-format "#[fg=brightblack] #I:#W "
set -g window-status-current-format "#[fg=blue,bold] #I:#W "
# Pane border, message, and copy-mode highlight colors.
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
set -g mode-style "bg=blue,fg=black"
setw -g clock-mode-colour blue
